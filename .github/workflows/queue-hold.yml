name: Queue Hold
on:
  pull_request:
permissions:
  contents: read
jobs:
  queue-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Hold speculative queue batch
        if: startsWith(github.event.pull_request.title, 'merge queue:')
        run: sleep 35
      - name: Pass
        run: echo "queue hold complete"
